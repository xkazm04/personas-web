name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Nightly e2e at 03:17 UTC — the only place the full Playwright suite
    # runs automatically (it rebuilds the app and takes ~10 minutes).
    - cron: "17 3 * * *"

# Action pins are by commit SHA with the tag in a trailing comment (a tag is a
# movable ref; a SHA is not). Each SHA below was resolved from the GitHub API
# tag ref on 2026-08-22 and is the current latest release. To move a pin:
# resolve the new tag to its SHA, replace both, and update the comment.

jobs:
  checks:
    name: typecheck · lint · unit · i18n · guide · build
    runs-on: ubuntu-latest
    # NOTE: this job deliberately has NO `if:` guard.
    #
    # It used to carry `if: github.event_name != 'schedule'`, which meant the
    # nightly runs — the ones that dominate the Actions default view — skipped
    # every check and showed only the e2e job. When `npm run lint` started
    # failing, every push run on master went red for five weeks and nobody saw
    # it, because the runs people looked at were the nightly ones that never
    # ran lint at all. The checks are ~3 minutes; running them nightly as well
    # costs almost nothing and makes a broken master visible in the view that
    # actually gets read.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Warning ceiling — see the enforcement policy comment in eslint.config.mjs.
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run check:i18n-coverage
      - run: npm run check:i18n-encoding
      # Gate: a topic listed in GUIDE_TOPICS but absent from its category's
      # content module 404s while still shipping SEO tags. Bidirectional, so a
      # partial parse fails loudly in both directions rather than passing thin.
      - run: npm run check:guide-content
      # Report-only, on purpose: no --fail-under / --fail-stale-over /
      # --fail-drift-over. The drift signal needs a sibling `personas` desktop
      # checkout, which no runner has, so the script reports every topic as
      # `desktop-repo-unavailable` and exits 0. A threshold here would be
      # reading a measurement that was never taken. Read the numbers in the log;
      # enforce thresholds only from a machine that has the desktop repo.
      - run: npm run check:guide-coverage
      #
      # NOT WIRED HERE, PERMANENTLY: `npm run check:guide-translations`.
      # The stored per-topic source hashes in src/data/guide/locales/*/_meta.json
      # include raw CRLF line endings, and CRLF is the canonical form by
      # decision — this project targets Windows and is not normalising. With no
      # .gitattributes, 98 of 116 hashes differ on a Linux checkout, so on
      # ubuntu-latest the detector would report ~100% stale: a number about line
      # endings, not about translations. Report-only here would print a page of
      # noise; --strict would block every PR for a reason that isn't real. A
      # `runner.os == 'Windows'` guard was rejected too — this job only ever
      # runs on ubuntu, so the step would be permanently skipped, which is
      # config that looks like a gate and is not.
      #
      # This is a settled decision, not a pending item. Translation drift is
      # checked from a Windows machine, deliberately. If someone ever wants it
      # in CI, the cheap route is a .gitattributes forcing `eol=crlf` on the
      # guide content so every checkout matches the pins that already exist —
      # normalising to LF instead invalidates all 1,261 pins at once.
      #
      - run: npm run build

      # Bundle ratchet. Must follow `npm run build` — it reads the per-route
      # first-load JS from .next/diagnostics/route-bundle-stats.json, which is
      # a build artifact. Ceilings live in bundle-budget.json; re-baseline with
      # `npm run check:bundle -- --update` and say why in the commit message.
      - run: npm run check:bundle

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    # Slow (full production build + serial suite) — nightly and on demand only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # `failure()` now also covers a passed-on-retry run: playwright.config.ts
      # sets failOnFlakyTests under CI, so the trace that `on-first-retry`
      # produced for a flake is uploaded instead of being discarded on a green run.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
