name: Agent rework budget

# Runs scripts/report-agent-rework.mjs on every PR so a lane over the rework
# budget (REWORK_BUDGET, docs/AI_HARNESS.md "How agent commits fared") is seen
# when its next change is reviewed, not only when someone runs the meter.
#
# Window: the script's default, the last 300 non-merge commits on the PR head.
# A PR-only range is too short to judge: rework is read from the next 10
# commits, so most of a PR's own commits would have no follow-up to look at.
#
# Annotate, do not block: each FLAG line becomes a warning on the PR, and the
# job stays green. The meter is a heuristic (see the script header), so it runs
# without the strict exit; the flag asks for a closer review, a person decides.
#
# Action pins match .github/workflows/ci.yml (commit SHA, tag in the comment).

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  rework:
    name: agent rework budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Report rework per lane and annotate flagged lanes
        # Explicit bash runs with pipefail, so a git failure in the meter still fails the job.
        shell: bash
        run: |
          node scripts/report-agent-rework.mjs --list | tee rework.txt
          grep '^  FLAG ' rework.txt | sed 's/^  FLAG /::warning title=Rework budget::/' || true
