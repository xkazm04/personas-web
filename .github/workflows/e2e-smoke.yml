name: e2e smoke

# The PR tier of the Playwright suite. The full suite (ci.yml `e2e`) rebuilds the
# app and runs every spec serially in about 10 minutes, so it runs nightly only and
# a PR could merge before e2e ever saw it. This job runs the specs that guard the
# highest-risk surfaces on every PR, under a hard time budget:
#
#   e2e/smoke.spec.ts           every public route renders, and the demo dashboard walks
#   e2e/csp.spec.ts             no Content-Security-Policy violation on any route
#   e2e/cookie-consent.spec.ts  the consent banner and what it stores (legal exposure)
#   e2e/legal.spec.ts           privacy, terms and cookie policy pages render
#
# Budget: `timeout-minutes` below. If the tier outgrows it the job fails, and the
# answer is to move a spec back to nightly, not to raise the number.
# The tier and the budget are pinned by src/lib/e2eSmokeTier.test.ts, and
# docs/testing/e2e-smoke-tier.md explains how they were chosen.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    name: playwright smoke tier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium e2e/smoke.spec.ts e2e/csp.spec.ts e2e/cookie-consent.spec.ts e2e/legal.spec.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-smoke-traces
          path: test-results/
          retention-days: 7
